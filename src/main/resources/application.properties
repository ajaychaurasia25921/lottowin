# ------------------------------------------------------------
# Core runtime
# ------------------------------------------------------------
quarkus.application.name=lottowin-gameboard-service
quarkus.http.port=${HTTP_PORT:8080}
quarkus.grpc.server.port=${GRPC_PORT:9000}
quarkus.grpc.server.use-separate-server=true
quarkus.log.category."com.lottowin.game".level=${LOTTOWIN_LOG_LEVEL:INFO}

# ------------------------------------------------------------
# MongoDB
# ------------------------------------------------------------
quarkus.mongodb.connection-string=${MONGODB_CONNECTION_STRING:mongodb://localhost:27017}
quarkus.mongodb.database=${MONGODB_DATABASE:lottowin}

# ------------------------------------------------------------
# Optional relational audit/reporting datasource for Flyway
# ------------------------------------------------------------
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${POSTGRES_USER:lottowin}
quarkus.datasource.password=${POSTGRES_PASSWORD:lottowin}
quarkus.datasource.jdbc.url=${POSTGRES_JDBC_URL:jdbc:postgresql://localhost:5432/lottowin}
quarkus.datasource.health.enabled=${DATASOURCE_HEALTH_ENABLED:false}
quarkus.flyway.migrate-at-start=${FLYWAY_MIGRATE_AT_START:false}
quarkus.flyway.baseline-on-migrate=true

# ------------------------------------------------------------
# Keycloak / SmallRye JWT
# Production expects a Keycloak realm public key or JWKS endpoint.
# Use MP_JWT_VERIFY_PUBLICKEY_LOCATION for containerized deployments.
# ------------------------------------------------------------
mp.jwt.verify.issuer=${KEYCLOAK_ISSUER:https://keycloak.example.com/realms/lottowin}
mp.jwt.verify.publickey.location=${KEYCLOAK_JWKS_URL:https://keycloak.example.com/realms/lottowin/protocol/openid-connect/certs}
smallrye.jwt.path.groups=realm_access/roles

# Secure all HTTP endpoints by default; method-level @RolesAllowed enforces the user role.
quarkus.http.auth.permission.authenticated.paths=/*
quarkus.http.auth.permission.authenticated.policy=authenticated

# ------------------------------------------------------------
# OpenAPI / Swagger UI
# ------------------------------------------------------------
quarkus.smallrye-openapi.info-title=Lottowin Game Board Service
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=Quarkus gRPC and REST service for game boards, wallet top-ups, and Razorpay payment verification.
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui

# ------------------------------------------------------------
# Razorpay
# Keep keys external. Razorpay test keys still use the normal SDK endpoint,
# but sandbox-mode is surfaced in logs and response payloads to prevent confusion.
# ------------------------------------------------------------
razorpay.key-id=${RAZORPAY_KEY_ID}
razorpay.key-secret=${RAZORPAY_KEY_SECRET}
razorpay.sandbox-mode=${RAZORPAY_SANDBOX_MODE:true}
razorpay.dev-mock-enabled=false

# ------------------------------------------------------------
# Service-level development fallback switches
# ------------------------------------------------------------
lottowin.dev-security-bypass=false
lottowin.dev-user-id=dev-user
lottowin.dev-wallet-balance-coins=100000
lottowin.payments.max-topup-coins=${LOTTOWIN_MAX_TOPUP_COINS:100000}

# ------------------------------------------------------------
# Dev profile
# This profile removes live Keycloak and Razorpay requirements for local loops.
# gRPC and REST methods still contain @RolesAllowed("user"); use a dev JWT when
# exercising framework-level auth, or rely on the service fallback for direct calls.
# ------------------------------------------------------------
%dev.quarkus.mongodb.connection-string=${DEV_MONGODB_CONNECTION_STRING:mongodb://localhost:27017}
%dev.quarkus.mongodb.database=${DEV_MONGODB_DATABASE:lottowin_dev}
%dev.quarkus.datasource.devservices.enabled=false
%dev.quarkus.flyway.migrate-at-start=false
%dev.mp.jwt.verify.issuer=dev-lottowin
%dev.mp.jwt.verify.publickey.location=publicKey.pem
%dev.quarkus.security.auth.enabled-in-dev-mode=false
%dev.quarkus.http.auth.permission.authenticated.policy=permit
%dev.lottowin.dev-security-bypass=true
%dev.lottowin.dev-user-id=dev-user
%dev.lottowin.dev-wallet-balance-coins=100000
%dev.razorpay.key-id=${RAZORPAY_TEST_KEY_ID:rzp_test_lottowin_mock}
%dev.razorpay.key-secret=${RAZORPAY_TEST_KEY_SECRET:rzp_test_lottowin_secret}
%dev.razorpay.sandbox-mode=true
%dev.razorpay.dev-mock-enabled=true

# ------------------------------------------------------------
# Test profile
# ------------------------------------------------------------
%test.quarkus.mongodb.database=lottowin_test
%test.quarkus.datasource.devservices.enabled=false
%test.quarkus.flyway.migrate-at-start=false
%test.lottowin.dev-security-bypass=true
%test.razorpay.key-id=rzp_test_lottowin_mock
%test.razorpay.key-secret=rzp_test_lottowin_secret
%test.razorpay.sandbox-mode=true
%test.razorpay.dev-mock-enabled=true
